name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependencies installeren
        run: npm install

      - name: Windows EXE bouwen
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifacts uploaden
        uses: actions/upload-artifact@v4
        with:
          name: CorioTEC-DrawingVault-v2.2.3-Windows
          path: |
            dist/*.exe
          retention-days: 30

      - name: Release aanmaken (bij tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
          name: CorioTEC DrawingVault ${{ github.ref_name }}
